name: Feature request
description: Suggest something CityLens should do.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and the problem it solves for you.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Optional. How you use CityGML (city models, BIM/indoor, research, teaching …), example files, other tools that do this well.
